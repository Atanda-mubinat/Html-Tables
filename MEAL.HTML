<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal time-table</title>
</head>
<body>
     <table border="10">
        <th>Day</th>
        <th>Breakfast</th>
        <th>Lunch</th>
        <th>Dinner</th>

        <tr>
           <td>Monday</td>
           <td>Rice</td>
           <td>Bread</td>
           <td>Amala</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Beans</td>
            <td>Garri</td>
            <td>Wheat</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>Pap</td>
            <td>Noodles</td>
            <td>Eba</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>Semo</td>
            <td>Rice</td>
            <td>Spagetti</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>Ofada rice</td>
            <td>Potato</td>
            <td>Pounded yam</td>
        </tr>

        <tr>
            <td>Saturday</td>
            <td>Friedrice</td>
            <td>Chicken&chips</td>
            <td>Beans</td>
        </tr>

        <tr>
            <td>Sunday</td>
            <td>Bread</td>
            <td>Rice And Beans</td>
            <td>Pasta</td>
        </tr>
    </table>
</body>
</html>
